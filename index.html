<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Block Breaker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <div class="game-area">
      <canvas id="game" width="600" height="450" aria-label="Block Breaker game"></canvas>
      <div id="gameOverlay" class="overlay">
        <div class="overlay-panel">
          <h2 id="overlayTitle">READY?</h2>
          <p id="overlayMessage">Move with the arrow keys or A and D. Press P to pause or resume.</p>
          <button id="overlayButton" type="button">Start Game</button>
        </div>
      </div>
    </div>
    <p id="instructions">Move the paddle with the left and right arrow keys, or A and D. Press P to pause or resume.</p>
  </main>

  <!-- The order matters: components.js defines data used by the game entities. -->
  <script src="components.js"></script>
  <script src="game.js"></script>
  <script src="bricks.js"></script>
  <script src="collisions.js"></script>
  <script>
    function system() {
      for (const entity of [ball, paddle]) {
        const data = entity.component;

        if (data.controlled) {
          const movingLeft = keys["arrowleft"] || keys["a"];
          const movingRight = keys["arrowright"] || keys["d"];
          data.vx = (movingRight - movingLeft) * data.speed;
        }

        data.x += data.vx;
        data.y += data.vy;

        if (data.controlled) {
          data.x = Math.max(0, Math.min(WIDTH - data.width, data.x));
        }
      }
    }
  </script>
</body>
</html>
