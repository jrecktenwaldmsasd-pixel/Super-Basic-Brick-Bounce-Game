<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Block Breaker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <div class="game-area">
      <div class="hud" aria-live="polite">
        <div class="hud-item">
          <span class="hud-label">Lives</span>
          <span id="livesValue">3</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">Score</span>
          <span id="scoreValue">0</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">Best</span>
          <span id="bestScoreValue">0</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">Level</span>
          <span id="levelValue">1</span>
        </div>
        <button id="muteButton" type="button" aria-pressed="false">Sound: On</button>
      </div>
      <canvas id="game" width="600" height="450" aria-label="Block Breaker game"></canvas>
      <div id="gameOverlay" class="overlay">
        <div class="overlay-panel">
          <h2 id="overlayTitle">READY?</h2>
          <p id="overlayMessage">Move with the arrow keys, A and D, or drag on the game. Press P to pause.</p>
          <label class="difficulty-control" for="difficultySelect">
            Difficulty
            <select id="difficultySelect">
              <option value="easy">Easy</option>
              <option value="normal" selected>Normal</option>
              <option value="hard">Hard</option>
            </select>
          </label>
          <button id="overlayButton" type="button">Start Game</button>
        </div>
      </div>
    </div>
    <p id="instructions">Move the paddle with the arrow keys, A and D, or drag/tap on the game. Press P to pause or resume. Press R to restart after game over.</p>
  </main>

  <!-- The order matters: components.js defines data used by the game entities. -->
  <script src="components.js"></script>
  <script src="game.js"></script>
  <script src="bricks.js"></script>
  <script src="collisions.js"></script>
  <script>
    function system() {
      const movingLeft = Boolean(keys["arrowleft"] || keys["a"]);
      const movingRight = Boolean(keys["arrowright"] || keys["d"]);
      const previousPaddleX = paddle.component.x;
      if (pointerPaddleX !== null) {
        paddle.component.x = pointerPaddleX - paddle.component.width / 2;
      } else {
        paddle.component.vx = (movingRight - movingLeft) * paddle.component.speed;
        paddle.component.x += paddle.component.vx;
      }
      paddle.component.x = Math.max(0, Math.min(WIDTH - paddle.component.width, paddle.component.x));
      paddle.component.vx = paddle.component.x - previousPaddleX;

      for (const activeBall of balls) {
        const data = activeBall.component;
        if (ballLaunched) {
          data.x += data.vx;
          data.y += data.vy;
        } else {
          data.x = paddle.component.x + (paddle.component.width - data.width) / 2;
          data.y = paddle.component.y - data.height;
        }
      }
    }
  </script>
</body>
</html>
